[package]
name = "expressir-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Rust core for Expressir: EXPRESS schema parsing and model building on parsanol"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "MIT"
repository = "https://github.com/lutaml/expressir-rs"
keywords = ["express", "iso-10303", "step", "parser", "lutaml"]
categories = ["parser-implementations"]
# Consumed through a git dependency by expressir's native extension;
# crates.io publishing stays disabled by design.
publish = false

[dependencies]
parsanol = { version = "=0.8.9" }
bincode = "1.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "expressir_rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
