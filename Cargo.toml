[package]
name = "expressir-rs"
version = "0.1.0"
edition = "2021"
description = "Rust core for Expressir: EXPRESS schema parsing and model building on parsanol"
license = "MIT"
repository = "https://github.com/lutaml/expressir-rs"
publish = false

[dependencies]
parsanol = { version = "=0.8.3" }
bincode = "1.3"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "expressir_rs"
