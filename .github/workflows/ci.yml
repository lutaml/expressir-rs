# Continuous Integration for expressir-rs
#
# Practices adopted from parsanol-rs:
# - Typos spell check
# - Format and clippy gates with warnings denied
# - Multi-platform testing (Linux, Windows, macOS)
# - MSRV and beta toolchains
# - Documentation build
# - Grammar no-drift against the Ruby tier

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.52.2

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.86" # MSRV (criterion-era toolchain, matches parsanol-rs)
          - os: ubuntu-latest
            toolchain: beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --examples

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  grammar-no-drift:
    name: Grammar no-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The embedded grammar is a copy of lutaml/expressir's edition-2
      # source (grammar-parg/express-grammar.parg); the gate diffs the
      # copy against that repo's main.
      - uses: actions/checkout@v4
        with:
          repository: lutaml/expressir
          path: expressir
      - name: Sync the split grammar (expressir#588)
        run: |
          for f in express-grammar.parg express_keywords.parg express_operators.parg express_remarks.parg express_literals.parg; do
            cp "expressir/grammar-parg/$f" "assets/$f"
          done
          # The model attr table (expressir#634): the ruby model tree is
          # the source of truth; this repo's copy must track it.
          cp "expressir/spec/fixtures/model_attr_table.json" "assets/model_attr_table.json"
      - run: git diff --exit-code assets/
      # The remark scanner + attachment ports are gated against the Ruby
      # lanes over every .exp fixture the expressir checkout carries.
      - run: RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test remark_scanner_parity
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The parity bundle resolves expressir's gemspec floors directly.
      # The former 0.8.161 overlay is gone: expressir's floor moved to
      # ~> 0.8.175 (the floors PR), and the drift the overlay once
      # pinned around was baseline-proven identical on both versions
      # (lutaml/lutaml-model#1160 closed as falsified).
      - run: |
          cd expressir
          # Pin the grammar release to the crate's lock: the capture and
          # span shapes the no-drift gates compare are pin-sensitive,
          # and a fresh resolve floats past the crate (the version-split
          # artifact the LSP gates already tripped over).
          echo 'gem "parsanol", "1.5.11"' >> Gemfile
          bundle install --jobs 4
          cd -
      - run: |
          RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test remark_attachment_parity
      - run: |
          RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test formatted_len_parity
      # The coverage engine vs the ruby Expressir::Coverage walk
      # (#644/#645): the delegation's order contract.
      - run: |
          RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test coverage_parity
      # The LSP gates (rs#567): the inventory + symbols corpus walks
      # are byte-exact against the ruby lane — both required.
      - run: |
          RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test lsp_inventory_parity
      - run: |
          RUST_MIN_STACK=67108864 EXPRESSIR_DIR=$PWD/expressir cargo test --release --test lsp_symbols_parity
