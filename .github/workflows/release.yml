# Release pipeline for expressir-rs.
#
# The P21 compile-parity gate (expressir#625) runs first: the sealed
# artifact's trees must replay the ruby compiler's output byte-for-byte
# and the population inventory must match the retired parser — drift
# here is a release blocker for both compilers. release-plz then
# creates the release PR (version + changelog) on every push to main;
# merging it tags and marks the release and publishes to crates.io
# (CARGO_REGISTRY_TOKEN; the crate's first publish is pending the
# token registration — see expressir#619).
#
# See: https://release-plz.dev/docs/config

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  parity-gate:
    name: P21 compile-parity (drift is a release blocker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: The artifact replays the ruby trees and the retired inventory
        run: cargo test --test p21_parg_parity --test p21_population_parity

  release-plz:
    name: Release-plz
    needs: parity-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
