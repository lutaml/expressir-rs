# Release-plz configuration for the expressir crate (repository: expressir-rs)
#
# Automated versioning, changelog generation, and crates.io publishing on
# every push to main (expressir#619): the crate is consumed by expressir's
# native ext as a version dependency, and CARGO_REGISTRY_TOKEN in the
# release workflow lets release-plz publish after the release PR merges.
# One-time owner step: register the crates.io token secret on the repo.
# See: https://release-plz.dev/docs/config

[workspace]
dependencies_update = true
# The crate stays on the 2.4.x line mirroring the gem train (owner
# decision 2026-11-26): semver-checks flags struct-literal breakage as
# a major bump, but the wire API the ext consumes is pinned by the
# ENGINE-COMPAT manifest instead of the crate major.
semver_check = false
# NOTE: the release-plz binary bundled by the action does not know
# the trusted_publishing field (unknown-field parse error) — the
# crate publish runs through the dedicated publish-crate job in
# release.yml: cargo >= 1.88 performs the crates.io OIDC exchange
# natively under id-token: write (#619).
# The house style (grammar:, tests:, docs:, model_json:) is not
# conventional-commit typed, so bump-triggering commits are rare;
# without this, grammar regens silently queue up unreleased.
release_always = true
git_release_enable = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""
