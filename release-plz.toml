# Release-plz configuration for expressir-rs
#
# Automated versioning, changelog generation, and crates.io publishing on
# every push to main (expressir#619): the crate is consumed by expressir's
# native ext as a version dependency, and CARGO_REGISTRY_TOKEN in the
# release workflow lets release-plz publish after the release PR merges.
# One-time owner step: register the crates.io token secret on the repo.
# See: https://release-plz.dev/docs/config

[workspace]
dependencies_update = true
# The house style (grammar:, tests:, docs:, model_json:) is not
# conventional-commit typed, so bump-triggering commits are rare;
# without this, grammar regens silently queue up unreleased.
release_always = true
git_release_enable = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""
